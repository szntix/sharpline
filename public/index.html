<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b5837">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sharpline">
  <meta name="description" content="Fantasy football lineups, waivers and trades from live betting lines and a tested model.">
  <title>Sharpline</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preload" href="/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script>try{var t=localStorage.getItem("sharpline.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <style>
    /* Opening screen: the turf with the logo's yard lines and ball, held until the app draws its first screen. It matches the phone's own launch screen (turf green behind the icon), so the hand-off has no flash. */
    #splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #fff; transition: opacity .28s ease;
      background: repeating-linear-gradient(90deg, #2b5837 0 12.5%, #2e6140 12.5% 25%); }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash svg { width: 112px; height: 112px; animation: spIn .55s ease both; }
    #splash b { font: 800 21px/1 Archivo, system-ui, sans-serif; font-stretch: 80%; letter-spacing: .2em; text-transform: uppercase; animation: spIn .55s .08s ease both; }
    #splash i { display: block; position: relative; width: 88px; height: 2px; border-radius: 1px; overflow: hidden; background: rgba(247, 245, 238, .22); animation: spIn .55s .16s ease both; }
    #splash small { font: 600 13px/1.3 Archivo, system-ui, sans-serif; color: #f7f5ee; opacity: 0; transition: opacity .4s ease; text-align: center; max-width: 240px; min-height: 17px; }
    #splash.slow small { opacity: .85; }
    #splash i::after { content: ""; position: absolute; inset: 0; width: 38%; border-radius: 1px; background: #f7f5ee; animation: spSweep 1.3s ease-in-out infinite; }
    @keyframes spIn { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes spSweep { from { transform: translateX(-110%); } to { transform: translateX(270%); } }
    @media (prefers-reduced-motion: reduce) { #splash, #splash svg, #splash b, #splash i, #splash i::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="8 6 48 52"><g stroke="#fff" stroke-width="2.6" opacity=".55"><path d="M16 8v48M32 8v48M48 8v48"/></g><ellipse cx="38" cy="30" rx="14" ry="8.6" transform="rotate(-18 38 30)" fill="#8a4620" stroke="#2b1206" stroke-width="1.6"/><path d="M31 32l14-6M34.5 26.5l1.6 5M38 25.3l1.6 5M41.5 24l1.6 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
    <b>Sharpline</b><i></i><small>Still loading. Check your connection.</small>
  </div>
  <div id="app"><div class="auth"><span class="spinner"></span></div></div>
  <noscript>Sharpline needs JavaScript to run.</noscript>
  <script>
    // Hide the opening screen once the app has drawn its first screen (never before 450 ms, so it does not flash), and never keep it up if the app cannot start.
    window.__hideSplash = function () {
      var s = document.getElementById("splash"); if (!s || s.__going) return; s.__going = true;
      setTimeout(function () { s.classList.add("out"); setTimeout(function () { s.remove(); var m = document.querySelector('meta[name="theme-color"]'); if (m && window.__themeColor) m.setAttribute("content", window.__themeColor); }, 300); }, Math.max(0, (window.__SPLASH_MIN || 450) - performance.now()));
    };
    setTimeout(function () { var s = document.getElementById("splash"); if (s) s.classList.add("slow"); }, window.__SPLASH_SLOW || 8000);
    setTimeout(window.__hideSplash, window.__SPLASH_MAX || 12000);
  </script>
  <script type="module" src="/js/app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});</script>
</body>
</html>
